<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Capa visual do sistema_tse</title>
  <desc id="desc">Interface conceitual de um simulador de transferência de votos, baseada no protótipo do projeto e sem dados reais.</desc>
  <rect width="1600" height="1000" fill="#fff"/>
  <rect width="1600" height="64" fill="#f2eee7"/>
  <path d="M0 64h1600" stroke="#ded7cb"/>
  <text x="48" y="39" fill="#27231f" font-family="system-ui, sans-serif" font-size="17" font-weight="700">sistema_tse</text>
  <text x="194" y="39" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">simulador de transferência de votos</text>
  <rect x="1392" y="20" width="150" height="27" rx="4" fill="#fff4e8" stroke="#e1bd92"/>
  <text x="1467" y="38" text-anchor="middle" fill="#b36d2c" font-family="system-ui, sans-serif" font-size="12" font-weight="700">PROTÓTIPO</text>

  <text x="64" y="124" fill="#766f67" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">SIMULAÇÃO CONDICIONAL</text>
  <text x="64" y="176" fill="#27231f" font-family="system-ui, sans-serif" font-size="34" font-weight="500">Escolha a premissa.</text>
  <text x="64" y="215" fill="#766f67" font-family="system-ui, sans-serif" font-size="18">Veja como uma taxa de passagem altera a leitura por seção.</text>

  <rect x="64" y="260" width="360" height="596" rx="8" fill="#f2eee7" stroke="#ded7cb"/>
  <text x="92" y="304" fill="#27231f" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Premissa da simulação</text>
  <text x="92" y="338" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">Doador</text>
  <rect x="92" y="350" width="304" height="53" rx="5" fill="#fff" stroke="#c9c0b5"/>
  <text x="112" y="382" fill="#27231f" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Candidato doador</text>
  <text x="92" y="445" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">Taxa de passagem</text>
  <rect x="92" y="458" width="304" height="8" rx="4" fill="#d8d0c6"/>
  <rect x="92" y="458" width="164" height="8" rx="4" fill="#b36d2c"/>
  <circle cx="256" cy="462" r="10" fill="#b36d2c" stroke="#fff" stroke-width="3"/>
  <text x="92" y="502" fill="#b36d2c" font-family="ui-monospace, monospace" font-size="21" font-weight="700">40%</text>
  <text x="92" y="550" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">Receptor</text>
  <rect x="92" y="562" width="304" height="53" rx="5" fill="#fff" stroke="#c9c0b5"/>
  <text x="112" y="594" fill="#27231f" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Candidato receptor</text>
  <path d="M92 665h304" stroke="#ded7cb"/>
  <text x="92" y="702" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">A taxa é uma premissa informada.</text>
  <text x="92" y="728" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">O resultado não é uma previsão.</text>
  <rect x="92" y="770" width="304" height="52" rx="5" fill="#334f85"/>
  <text x="244" y="802" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Atualizar projeção</text>

  <rect x="464" y="260" width="1072" height="596" rx="8" fill="#fff" stroke="#ded7cb"/>
  <text x="504" y="305" fill="#766f67" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">RESULTADO PROJETADO</text>
  <text x="504" y="360" fill="#b36d2c" font-family="ui-monospace, monospace" font-size="42" font-weight="700">2.480</text>
  <text x="504" y="388" fill="#766f67" font-family="system-ui, sans-serif" font-size="14">votos condicionais no recorte</text>
  <rect x="834" y="302" width="300" height="82" rx="5" fill="#eef2fa" stroke="#ccd6e8"/>
  <text x="858" y="333" fill="#334f85" font-family="system-ui, sans-serif" font-size="13" font-weight="700">HIERARQUIA DE LEITURA</text>
  <text x="858" y="360" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">UF → município → zona → seção</text>
  <rect x="1168" y="302" width="320" height="82" rx="5" fill="#fff4e8" stroke="#e1bd92"/>
  <text x="1192" y="333" fill="#b36d2c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PREMISSA ATIVA</text>
  <text x="1192" y="360" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">passagem de 40% · dados fictícios</text>
  <path d="M504 430h984" stroke="#ded7cb"/>
  <text x="504" y="474" fill="#27231f" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Distribuição por recorte</text>
  <text x="504" y="510" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">Uma leitura que mantém a origem e a hipótese visíveis.</text>

  <text x="504" y="570" fill="#766f67" font-family="ui-monospace, monospace" font-size="13">PB</text>
  <rect x="560" y="556" width="530" height="18" rx="3" fill="#eef2fa"/>
  <rect x="560" y="556" width="382" height="18" rx="3" fill="#334f85"/>
  <text x="1112" y="570" fill="#27231f" font-family="ui-monospace, monospace" font-size="13">1.780</text>
  <text x="504" y="630" fill="#766f67" font-family="ui-monospace, monospace" font-size="13">PE</text>
  <rect x="560" y="616" width="530" height="18" rx="3" fill="#eef2fa"/>
  <rect x="560" y="616" width="236" height="18" rx="3" fill="#334f85"/>
  <text x="1112" y="630" fill="#27231f" font-family="ui-monospace, monospace" font-size="13">420</text>
  <text x="504" y="690" fill="#766f67" font-family="ui-monospace, monospace" font-size="13">CE</text>
  <rect x="560" y="676" width="530" height="18" rx="3" fill="#eef2fa"/>
  <rect x="560" y="676" width="140" height="18" rx="3" fill="#334f85"/>
  <text x="1112" y="690" fill="#27231f" font-family="ui-monospace, monospace" font-size="13">280</text>
  <path d="M504 742h984" stroke="#ded7cb"/>
  <text x="504" y="786" fill="#766f67" font-family="system-ui, sans-serif" font-size="13">Visual conceitual baseado no protótipo · sem dados eleitorais reais.</text>
</svg>
